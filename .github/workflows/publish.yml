name: Auto-update & publish

# One workflow does everything: on the daily schedule it compares the pin in
# the Dockerfile against the newest speech-to-speech release on PyPI; when a
# new upstream version exists it builds the image, publishes it to ghcr.io
# (and Docker Hub too, if DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are set),
# and only then commits the version bump and cuts the release tag.
# Pushing a tag manually (e.g. after editing the Dockerfile itself) builds
# that exact tag. workflow_dispatch allows a forced build of any version.

on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC daily
  workflow_dispatch:
    inputs:
      version:
        description: 'Force-build a specific upstream version (blank = auto-check)'
        required: false
        default: ''
  push:
    tags:
      - '*'

env:
  GHCR_IMAGE: ghcr.io/aurial/speech-to-speech-docker

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version to build
        id: ver
        run: |
          PIN=$(grep -oP 'speech-to-speech\[[^\]]*\]==\K[^"]+' Dockerfile)
          echo "pin=$PIN"
          if [ "${{ github.event_name }}" = "push" ]; then
            # Manual tag push: build exactly what was tagged.
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "bump=0" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}.1" >> "$GITHUB_OUTPUT"
            echo "bump=1" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(curl -s https://pypi.org/pypi/speech-to-speech/json | python3 -c "import sys,json;print(json.load(sys.stdin)['info']['version'])")
            echo "pypi_latest=$LATEST"
            if [ "$LATEST" = "$PIN" ]; then
              echo "::notice::Up to date ($PIN) - nothing to build"
              echo "skip=1" >> "$GITHUB_OUTPUT"
            fi
            echo "version=$LATEST.1" >> "$GITHUB_OUTPUT"
            echo "bump=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if nothing changed
        if: steps.ver.outputs.skip == '1'
        run: echo "No new upstream release; exiting cleanly."

      - name: Check upstream release exists
        if: steps.ver.outputs.skip != '1'
        run: |
          V=$(echo "${{ steps.ver.outputs.version }}" | cut -d. -f1-3)
          curl -sf "https://pypi.org/pypi/speech-to-speech/$V/json" > /dev/null \
            || { echo "speech-to-speech $V is not on PyPI"; exit 1; }

      - name: Docker Hub configured?
        if: steps.ver.outputs.skip != '1'
        id: hub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.ver.outputs.skip != '1'

      - uses: docker/login-action@v3
        if: steps.ver.outputs.skip != '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional)
        id: hublogin
        if: steps.ver.outputs.skip != '1' && steps.hub.outputs.enabled == '1'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push to ghcr
        if: steps.ver.outputs.skip != '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest

      - name: Build & push to Docker Hub (optional)
        if: steps.ver.outputs.skip != '1' && steps.hublogin.outcome == 'success' && steps.hub.outputs.enabled == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/speech-to-speech:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/speech-to-speech:latest

      - name: Commit bump and cut tag (only after a successful build)
        if: steps.ver.outputs.skip != '1' && steps.ver.outputs.bump == '1'
        run: |
          V=$(echo "${{ steps.ver.outputs.version }}" | cut -d. -f1-3)
          sed -i "s/\(speech-to-speech\[[^]]*\]==\)[^\"']*/\1$V/" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "speech-to-speech $V (automated)"
          git push origin HEAD:${{ github.ref_name }}
          git tag "${{ steps.ver.outputs.version }}"
          git push origin "${{ steps.ver.outputs.version }}"
